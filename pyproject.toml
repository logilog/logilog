[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "logilog"
version = "0.1.0"
description = "MCP SaaS backend built with FastAPI"
authors = [{name = "LogiLog", email = "founders@logilog.ai"}]
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.23",
    "sqlalchemy[asyncio]>=2.0",
    "pydantic>=2.5",
    "pydantic-settings>=2.0",
    "python-jose[cryptography]>=3.3",
    "passlib[bcrypt]>=1.7",
    "httpx>=0.24",
    "aiosqlite>=0.19",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "anyio>=3.7",
]

[tool.uvicorn]
factory = false
app = "backend.app.main:app"
host = "0.0.0.0"
port = 8000
reload = true
